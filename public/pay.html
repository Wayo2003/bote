<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pay your share · Bote</title>
<link rel="icon" href="/jar.svg">
<link rel="stylesheet" href="/app.css">
<style>
  body { min-height: 100vh; background: linear-gradient(180deg, #0f2a44 0, #0f2a44 230px, var(--bg) 230px); }
  .wrap { max-width: 460px; margin: 0 auto; padding: 22px 16px 40px; }
  .top { color: #fff; display: flex; justify-content: space-between; align-items: center; }
  .top .logo { color: #fff; }
  .hello { color: #fff; margin: 26px 0 18px; }
  .hello h1 { font-size: 30px; margin: 0 0 4px; }
  .hello p { margin: 0; opacity: .8; }
  .box { padding: 22px; }
  .due { text-align: center; padding: 6px 0 16px; }
  .due .lbl { font-size: 12px; font-weight: 800; letter-spacing: .1em; color: var(--muted); }
  .due .amt { font-size: 52px; font-weight: 900; letter-spacing: -.03em; }
  .lines div { display: flex; justify-content: space-between; font-size: 14.5px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .lines div:last-child { border-bottom: 0; }
  #buttons { margin-top: 20px; min-height: 50px; }
  .done { text-align: center; padding: 24px 6px; }
  .done .tick { width: 76px; height: 76px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-d); display: grid; place-items: center; font-size: 40px; margin: 0 auto 12px; animation: pop .4s ease; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  .alt { text-align: center; font-size: 13px; margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="logo"><img class="jar" src="/jar.svg" alt="">Bote</span><span class="mode" id="mode"></span></div>
  <div class="hello"><h1 class="serif" id="hi">Hi!</h1><p id="sub"></p></div>
  <div class="card box" id="box"><div class="muted">Loading…</div></div>
  <p class="small muted" style="text-align:center;margin-top:16px">Payments are processed by PayPal. Bote never sees your card or bank details.</p>
</div>
<script>
const [, , gid, mid] = location.pathname.split('/');
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let D;
const money = (c) => `${(c / 100).toLocaleString('en', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ${D.currency === 'EUR' ? '€' : D.currency}`;
const post = (p, b) => fetch(`/api/pay/${gid}/${mid}/${p}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b || {}) }).then((r) => r.json());

function paid() {
  $('box').innerHTML = `<div class="done"><div class="tick">✓</div><div class="serif" style="font-size:24px;font-weight:800">You're all square</div><p class="muted">${esc(D.organizer)} and the group can see it in Bote. Thanks!</p></div>`;
}

async function load() {
  D = await (await fetch(`/api/pay/${gid}/${mid}`)).json();
  $('mode').textContent = D.mode === 'sandbox' ? 'PAYPAL SANDBOX' : 'DEMO MODE';
  $('hi').textContent = `Hi ${D.member} 👋`;
  $('sub').textContent = `${D.organizer} is collecting for "${D.group}" with Bote.`;
  if (D.due <= 0) return paid();
  $('box').innerHTML = `<div class="due"><div class="lbl">YOUR SHARE</div><div class="amt num">${money(D.due)}</div></div>
    <div class="lines">${D.items.map((i) => `<div><span>${esc(i.expense)}</span><b class="num">${money(i.cents)}</b></div>`).join('')}
    ${D.fronted ? `<div><span>You already paid</span><b class="num" style="color:var(--brand-d)">−${money(D.fronted)}</b></div>` : ''}
    ${D.paidIn ? `<div><span>Paid so far</span><b class="num" style="color:var(--brand-d)">−${money(D.paidIn)}</b></div>` : ''}</div>
    <div id="buttons"></div>
    ${D.invoiceUrl ? `<div class="alt"><a href="${esc(D.invoiceUrl)}" target="_blank">Or pay the PayPal invoice ↗</a></div>` : ''}`;
  if (D.mode === 'sandbox' && D.clientId) {
    const s = document.createElement('script');
    s.src = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(D.clientId)}&currency=${D.currency}&intent=capture`;
    s.onload = () => paypal.Buttons({
      style: { layout: 'vertical', shape: 'pill', label: 'pay' },
      createOrder: async () => (await post('order')).id,
      onApprove: async (data) => { const r = await post('capture', { orderId: data.orderID }); if (r.ok) paid(); else alert(r.error); },
    }).render('#buttons');
    document.head.append(s);
  } else {
    $('buttons').innerHTML = `<button class="btn green" style="width:100%;padding:15px;font-size:17px" id="sim">Pay ${money(D.due)} (simulated PayPal)</button>`;
    $('sim').onclick = async () => { $('sim').disabled = true; const o = await post('order'); const r = await post('capture', { orderId: o.id }); if (r.ok) paid(); };
  }
}
load();
</script>
</body>
</html>
