<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bote</title>
<link rel="icon" href="/jar.svg">
<link rel="stylesheet" href="/app.css">
<style>
  body { height: 100vh; overflow: hidden; }
  .app { height: 100vh; display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: #fffdf8; }
  header h1 { margin: 0; font-size: 20px; }
  .main { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(380px, 1fr); min-height: 0; }
  /* chat */
  .chat { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: #fbf9f4; }
  .msgs { flex: 1; overflow: auto; padding: 22px 26px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 82%; padding: 12px 15px; border-radius: 18px; line-height: 1.5; font-size: 15px; box-shadow: 0 1px 1px rgba(0,0,0,.04); animation: in .25s ease both; }
  @keyframes in { from { opacity: 0; transform: translateY(5px); } }
  .msg.bote { background: #fff; border: 1px solid var(--line); border-start-start-radius: 6px; }
  .msg.bote .who { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 13px; color: var(--brand-d); margin-bottom: 4px; }
  .msg.bote .who img { width: 18px; }
  .msg.organizer { align-self: flex-end; background: var(--navy); color: #fff; border-start-end-radius: 6px; }
  .msg ul { margin: 6px 0; padding-left: 20px; } .msg li { margin: 2px 0; }
  .msg p { margin: 0 0 6px; } .msg p:last-child { margin: 0; }
  .event { align-self: center; font-size: 12.5px; color: var(--muted); background: #fff; border: 1px dashed var(--line); padding: 6px 12px; border-radius: 99px; animation: in .25s ease both; }
  .approve { max-width: 82%; border: 2px solid var(--coin); background: #fffaf0; border-radius: 18px; padding: 14px 16px; animation: in .25s ease both; }
  .approve .t { font-weight: 800; display: flex; gap: 8px; align-items: center; }
  .approve .lines { margin: 10px 0; font-size: 14px; }
  .approve .lines div { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed #eedfb8; }
  .approve .row { display: flex; gap: 8px; }
  .approve.done { border-color: var(--brand); background: #f3fdf7; }
  .approve.rejected, .approve.failed { border-color: #ccc; background: #f7f7f7; opacity: .8; }
  .typing { align-self: flex-start; display: flex; gap: 4px; padding: 14px 16px; background: #fff; border: 1px solid var(--line); border-radius: 18px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--brand); animation: b 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes b { 50% { transform: translateY(-5px); opacity: .5; } }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 22px 10px; }
  .chips button { border: 1px solid #bfe8d4; background: #fff; color: var(--brand-d); border-radius: 99px; padding: 8px 13px; font-size: 13.5px; font-weight: 600; text-align: left; }
  .composer { display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--line); background: #fff; }
  .composer textarea { resize: none; height: 52px; }
  /* pot */
  .pot { overflow: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .meter { padding: 20px; background: linear-gradient(150deg, #0f2a44, #134e4a); color: #fff; border: 0; }
  .meter .big { font-size: 40px; font-weight: 900; letter-spacing: -.02em; }
  .meter .bar { height: 12px; background: rgba(255,255,255,.15); border-radius: 12px; overflow: hidden; margin: 12px 0 8px; }
  .meter .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand), var(--coin)); border-radius: 12px; transition: width .6s ease; }
  .meter .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
  .meter .stats div { background: rgba(255,255,255,.08); border-radius: 12px; padding: 9px 11px; font-size: 12px; opacity: .95; }
  .meter .stats b { display: block; font-size: 16px; }
  .sect { padding: 16px 18px; }
  .sect h3 { margin: 0 0 10px; font-size: 12px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; display: flex; justify-content: space-between; }
  .mem { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid #f0ece3; }
  .mem:last-child { border-bottom: 0; }
  .av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; }
  .mem .n { font-weight: 700; }
  .mem .d { font-size: 12.5px; color: var(--muted); }
  .mem .r { text-align: right; }
  .mem .amt { font-weight: 800; }
  .link { font-size: 12px; color: var(--info); text-decoration: none; font-weight: 600; cursor: pointer; }
  .exp { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f0ece3; font-size: 14px; }
  .exp:last-child { border-bottom: 0; }
  .act { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 13px; padding: 6px 0; }
  .act .t { color: var(--muted); font-size: 11px; }
  .empty { color: var(--muted); font-size: 13.5px; }
  @media (max-width: 980px) { body { overflow: auto; height: auto; } .app { height: auto; } .main { grid-template-columns: 1fr; } .chat { height: 80vh; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="logo" href="/"><img class="jar" src="/jar.svg" alt="">Bote</a>
    <span class="muted">/</span>
    <h1 id="gname" class="serif"></h1>
    <span style="flex:1"></span>
    <span class="mode" id="mode"></span>
    <button class="btn ghost small" id="sync">↻ Check PayPal</button>
  </header>
  <div class="main">
    <section class="chat">
      <div class="msgs" id="msgs"></div>
      <div class="chips" id="chips"></div>
      <form class="composer" id="composer">
        <textarea id="text" placeholder="Tell Bote the plan, or ask anything: who still owes? pay the bus. Pedro can't come…"></textarea>
        <button class="btn green">Send</button>
      </form>
    </section>
    <aside class="pot">
      <div class="card meter">
        <div class="small" style="opacity:.8;font-weight:700;letter-spacing:.06em">IN THE POT</div>
        <div class="big num" id="cash">0</div>
        <div class="bar"><i id="bar"></i></div>
        <div class="small" id="progress" style="opacity:.85"></div>
        <div class="stats" id="stats"></div>
      </div>
      <div class="card sect"><h3><span>People</span><span id="pcount"></span></h3><div id="people"></div></div>
      <div class="card sect"><h3><span>The plan</span><span id="total"></span></h3><div id="expenses"></div></div>
      <div class="card sect"><h3><span>PayPal activity</span></h3><div id="activity"></div></div>
    </aside>
  </div>
</div>
<script>
const gid = location.pathname.split('/').pop();
const $ = (id) => document.getElementById(id);
let G = null, lastChat = 0;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (c, cur = G.currency) => `${(c / 100).toLocaleString('en', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ${cur === 'EUR' ? '€' : cur === 'USD' ? '$' : cur === 'GBP' ? '£' : cur}`;
const COLORS = ['#10b981', '#2d6cdf', '#f59e0b', '#ef4444', '#8b5cf6', '#0ea5e9', '#ec4899', '#14b8a6', '#f97316'];
const color = (s) => COLORS[[...s].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
const ago = (t) => { const s = (Date.now() - t) / 1000; return s < 60 ? 'just now' : s < 3600 ? `${Math.floor(s / 60)} min ago` : new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); };

function md(text) {
  const lines = esc(text).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>').split('\n');
  let html = '', inList = false;
  for (const l of lines) {
    const m = l.match(/^\s*[-•*]\s+(.*)/) || l.match(/^\s*\d+\.\s+(.*)/);
    if (m) { if (!inList) { html += '<ul>'; inList = true; } html += `<li>${m[1]}</li>`; continue; }
    if (inList) { html += '</ul>'; inList = false; }
    if (l.trim()) html += `<p>${l}</p>`;
  }
  return html + (inList ? '</ul>' : '');
}

function renderChat() {
  const items = [
    ...G.chat.map((c) => ({ at: c.at, kind: 'chat', c })),
    ...G.actions.map((a) => ({ at: a.at + 1, kind: 'action', a })),
  ].sort((x, y) => x.at - y.at);
  const box = $('msgs');
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.innerHTML = items.map((it) => {
    if (it.kind === 'chat') {
      const c = it.c;
      if (c.role === 'organizer' && c.text.startsWith('[event]')) return '';
      return c.role === 'bote'
        ? `<div class="msg bote"><div class="who"><img src="/jar.svg">Bote</div>${md(c.text)}</div>`
        : `<div class="msg organizer">${md(c.text)}</div>`;
    }
    const a = it.a;
    const label = { pending: '⏳ Waiting for your approval', running: '⚙️ Running on PayPal…', done: '✅ Approved and done', rejected: '✋ Declined', failed: `⚠️ Failed: ${esc(a.error || '')}` }[a.status];
    return `<div class="approve ${a.status}"><div class="t">💳 ${esc(a.summary)}</div>
      ${a.lines ? `<div class="lines">${a.lines.map((l) => `<div><span>${esc(l.label)}</span><b class="num">${esc(l.amount)}</b></div>`).join('')}</div>` : ''}
      <div class="small muted" style="margin-bottom:${a.status === 'pending' ? 10 : 0}px">${label}</div>
      ${a.status === 'pending' ? `<div class="row"><button class="btn green" data-ok="${a.id}">Approve</button><button class="btn ghost" data-no="${a.id}">Decline</button></div>` : ''}</div>`;
  }).join('') + (G.thinking ? '<div class="typing"><i></i><i></i><i></i></div>' : '');
  box.querySelectorAll('[data-ok]').forEach((b) => (b.onclick = () => act(b.dataset.ok, 'approve', b)));
  box.querySelectorAll('[data-no]').forEach((b) => (b.onclick = () => act(b.dataset.no, 'reject', b)));
  if (atBottom || G.chat.length !== lastChat) box.scrollTop = box.scrollHeight;
  lastChat = G.chat.length;
  const fresh = G.chat.filter((c) => c.role === 'organizer').length === 0;
  $('chips').innerHTML = fresh ? SUGGEST.map((s, i) => `<button data-s="${i}">${esc(s)}</button>`).join('') : '';
  $('chips').querySelectorAll('button').forEach((b) => (b.onclick = () => { $('text').value = SUGGEST[b.dataset.s]; $('text').focus(); }));
}

const SUGGEST = [
  "We're 6 going to the Betis–Sevilla derby: me, Juan, Pedro, Lucía, Marta and Omar. Tickets are 45 € each, and the bus is 300 € in total for Autocares Triana (bus@example.com). Juan already paid 60 € for the snacks for everyone.",
  'Dinner for Laura\'s birthday: 8 of us, set menu 32 € per person, and we split her gift (120 €) among the 7 of us.',
];

async function act(id, what, btn) {
  btn.disabled = true;
  await fetch(`/api/groups/${gid}/actions/${id}/${what}`, { method: 'POST' });
}

function renderPot() {
  const p = G.pot;
  $('gname').textContent = G.name;
  document.title = `${G.name} · Bote`;
  $('mode').textContent = G.mode === 'sandbox' ? 'PAYPAL SANDBOX' : 'DEMO MODE';
  $('mode').className = 'mode ' + G.mode;
  $('cash').textContent = money(p.cash);
  const pct = p.toCollect ? Math.min(100, (100 * p.collected) / p.toCollect) : 0;
  $('bar').style.width = pct + '%';
  $('progress').textContent = p.toCollect ? `${money(p.collected)} collected of ${money(p.toCollect)} · ${Math.round(pct)}%` : 'Tell Bote the plan to start collecting.';
  $('stats').innerHTML = [['Still owed', p.outstanding], ['Vendors to pay', p.vendorsDue], ['Paid out & back', p.vendorPaid + p.refunded]].map(([l, v]) => `<div>${l}<b class="num">${money(v)}</b></div>`).join('');
  const people = G.members.filter((m) => !m.left || m.due !== 0);
  $('pcount').textContent = people.length;
  $('people').innerHTML = people.map((m) => {
    const st = m.status;
    const pillText = { organizer: 'holds the pot', pending: m.request ? 'requested' : 'to request', partial: 'partly paid', settled: m.share ? 'paid ✓' : 'nothing owed', owed: 'pot owes them' }[st];
    const right = st === 'organizer' ? `<div class="amt num">${money(m.share)}</div><div class="d">own share</div>`
      : st === 'owed' ? `<div class="amt num" style="color:#7c3aed">${money(-m.due)}</div><div class="d">to give back</div>`
      : st === 'settled' ? `<div class="amt num" style="color:var(--brand-d)">${money(m.paidIn)}</div><div class="d">paid</div>`
      : `<div class="amt num">${money(m.due)}</div><div class="d">${m.request ? `<a class="link" href="${m.payLink}" target="_blank">open pay link ↗</a>` : 'owes'}</div>`;
    return `<div class="mem"><div class="av" style="background:${color(m.name)}">${esc(m.name[0])}</div>
      <div><div class="n">${esc(m.name)}${m.left ? ' <span class="small muted">(dropped out)</span>' : ''}</div><div class="d"><span class="pill ${st}">${pillText}</span> ${m.share ? `share ${money(m.share)}` : ''}${m.fronted ? ` · fronted ${money(m.fronted)}` : ''}</div></div>
      <div class="r">${right}</div></div>`;
  }).join('');
  $('total').textContent = G.expenses.length ? money(p.total) : '';
  $('expenses').innerHTML = G.expenses.map((e) => `<div class="exp"><div><b>${esc(e.description)}</b><div class="small muted">${e.paidByName ? `paid by ${esc(e.paidByName)}` : e.vendor ? `vendor: ${esc(e.vendor.name)}${e.vendorPaid ? ' · <span class="pill paid">paid ✓</span>' : ''}` : 'from the pot'}</div></div><b class="num">${money(e.amount)}</b></div>`).join('') || '<div class="empty">No expenses yet.</div>';
  $('activity').innerHTML = G.activity.map((a) => `<div class="act"><span>${a.icon}</span><div>${esc(a.text)}<div class="t">${ago(a.at)}</div></div></div>`).join('') || '<div class="empty">Payments, invoices and payouts will show up here.</div>';
}

function render() { renderChat(); renderPot(); }

$('composer').onsubmit = async (e) => {
  e.preventDefault();
  const text = $('text').value.trim();
  if (!text) return;
  $('text').value = '';
  await fetch(`/api/groups/${gid}/chat`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
};
$('text').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('composer').requestSubmit(); } });
$('sync').onclick = () => fetch(`/api/groups/${gid}/sync`, { method: 'POST' });

function connect() {
  const es = new EventSource(`/api/groups/${gid}/stream`);
  es.onmessage = (e) => { G = JSON.parse(e.data); render(); };
  es.onerror = () => { es.close(); setTimeout(connect, 1500); };
}
connect();
setInterval(() => G && renderPot(), 30000);
</script>
</body>
</html>
